<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genz Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; color: white; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .card { background: #252525; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 80%; border: 1px solid #333; }
        .balance-title { color: #aaa; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .balance-value { font-size: 36px; font-weight: bold; margin: 15px 0; color: #00ff88; }
        .btn { background: #0088cc; color: white; border: none; padding: 15px 30px; border-radius: 12px; font-weight: bold; width: 100%; font-size: 16px; cursor: pointer; transition: 0.3s; }
        .btn:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="card">
        <div class="balance-title">Total Balance</div>
        <div id="balance" class="balance-value">Rp 1.500.000</div>
        <button class="btn" onclick="withdraw()">WITHDRAW</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Biar layar penuh pas dibuka

        function withdraw() {
            tg.showAlert("Withdraw Berhasil! Saldo akan dikirim ke akun Anda.");
        }
    </script>
</body>
</html>
